# Раздача собранного SPA внутри контейнера (host nginx проксирует сюда).
#
# Ключевое отличие от прежнего `serve -s dist`: SPA-фолбэк на index.html действует
# только для маршрутов приложения. Промах по /assets/ — честный 404, иначе браузер
# получает HTML вместо модуля, падает с «Importing a module script failed»
# и кэширует этот ответ под именем чанка.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Имена файлов содержат хэш содержимого: старый чанк после деплоя должен исчезать,
    # а не подменяться оболочкой.
    location /assets/ {
        try_files $uri =404;
        # Без `always`: заголовок не попадёт на 404, иначе браузер закэширует промах на год.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
