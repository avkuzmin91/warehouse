events {}

http {
  # Скрытие версии nginx; без заголовка Server от upstream. См. nginx/nginx.conf — про headers-more.
  server_tokens off;
  proxy_hide_header Server;

  server {
    listen 80;

    # PR8: базовый CSP для SPA (API тот же origin через /api/).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; upgrade-insecure-requests" always;

    location / {
      proxy_pass http://frontend:80;
    }

    location /api/ {
      proxy_pass http://backend:8000/;
    }
  }
}
