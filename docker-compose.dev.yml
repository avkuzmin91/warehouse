# Локальная разработка: отдельные порты и тома БД, не затрагивает production.
name: wms-dev

services:
  db:
    image: postgres:16
    container_name: wms_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: wms_dev_backend
    restart: unless-stopped
    env_file:
      - .env.dev
    depends_on:
      - db
    expose:
      - "8000"
    ports:
      - "8001:8000"

  frontend:
    build: ./frontend
    container_name: wms_dev_frontend
    restart: unless-stopped
    env_file:
      - .env.dev
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: wms_dev_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  db_data_dev:
