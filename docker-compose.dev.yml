# Dev: Postgres + backend (--reload). UI — локально: npm run dev (Vite :5173).
# name: обязателен — иначе project = имя каталога (wms-prod) и dev сломает prod compose.
name: wms-dev

services:
  db:
    image: postgres:16
    container_name: wms_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: wms_dev_backend
    restart: unless-stopped
    working_dir: /app
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: dev
    env_file:
      - .env.dev
    volumes:
      - ./backend:/app
    depends_on:
      - db
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  db_data_dev:
