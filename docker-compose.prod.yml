
version: "3.9"

services:
  db:
    image: postgres:16
    container_name: wms_prod_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: wms_prod_backend
    restart: always
    env_file:
      - .env.prod
    depends_on:
      - db
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: wms_prod_frontend
    restart: always
    env_file:
      - .env.prod
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: wms_prod_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
