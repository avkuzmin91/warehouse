# Параметры инстанса (несколько систем на одном VPS — scripts/onboarding/new-instance.sh):
#   WMS_INSTANCE          — имя compose-проекта (изоляция томов/сетей), по умолчанию wms-prod
#   WMS_CONTAINER_PREFIX  — префикс имён контейнеров, по умолчанию wms_prod
#   WMS_BACKEND_PORT / WMS_FRONTEND_PORT — loopback-порты, по умолчанию 10000 / 10080
# Без этих переменных поведение идентично прежнему (ваш prod, CI-деплой по ADR 0001).
name: ${WMS_INSTANCE:-wms-prod}

services:
  db:
    image: postgres:16
    container_name: ${WMS_CONTAINER_PREFIX:-wms_prod}_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: ${WMS_CONTAINER_PREFIX:-wms_prod}_backend
    restart: always
    environment:
      APP_ENV: prod
      # Бизнес-даты (business_today, date.today) считаются по МСК; без TZ контейнер
      # живёт в UTC и с 00:00 до 03:00 МСК относит операции на вчера.
      TZ: Europe/Moscow
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/app
      APP_VERSION: ${APP_VERSION:-}
      JWT_SECRET: ${JWT_SECRET}
    env_file:
      - .env.prod
    # Фото товаров и import staging — на хосте (переживают пересборку контейнера).
    # Путь на хосте: по умолчанию /var/www/app-prod/uploads; переопределение: WAREHOUSE_UPLOADS_HOST_PATH_PROD.
    volumes:
      - ${WAREHOUSE_UPLOADS_HOST_PATH_PROD:-/var/www/app-prod/uploads}:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WMS_BACKEND_PORT:-10000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_TITLE: ${VITE_APP_TITLE:-Pack-men}
    container_name: ${WMS_CONTAINER_PREFIX:-wms_prod}_frontend
    restart: always
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${WMS_FRONTEND_PORT:-10080}:80"

volumes:
  db_data: