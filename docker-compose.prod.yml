name: wms-prod

services:
  db:
    image: postgres:16
    container_name: wms_prod_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: wms_prod_backend
    restart: always
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/app
      APP_VERSION: ${APP_VERSION:-}
    # Фото товаров и import staging — на хосте (переживают пересборку контейнера).
    # Путь на хосте: по умолчанию /var/www/app-prod/uploads; переопределение: WAREHOUSE_UPLOADS_HOST_PATH_PROD.
    volumes:
      - ${WAREHOUSE_UPLOADS_HOST_PATH_PROD:-/var/www/app-prod/uploads}:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:10000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: wms_prod_frontend
    restart: always
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:10080:80"

volumes:
  db_data: