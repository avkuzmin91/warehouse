# Reusable: доставка репозитория на VPS (rsync) → env-файл → docker compose → health gate.
# Секреты и (опционально) approval — через GitHub Environment `test` / `production`.
name: Deploy environment

on:
  workflow_call:
    inputs:
      environment_name:
        description: "GitHub Environment (test | production)"
        type: string
        required: true
      remote_path:
        description: "Каталог приложения на сервере"
        type: string
        required: true
      compose_file:
        description: "Compose-файл (например docker-compose.test.yml)"
        type: string
        required: true
      env_file:
        description: "Имя env-файла в remote_path (например .env.test)"
        type: string
        required: true
      health_port:
        description: "Loopback-порт backend для /health (README contract)"
        type: string
        required: true
      deploy_kind:
        description: "test | prod — шаблон записи env-файла"
        type: string
        required: true
      deploy_ref:
        description: "Git ref (SHA / branch / tag) для checkout"
        type: string
        required: true

concurrency:
  group: deploy-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_ref }}

      - name: Resolve deployed commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log deployment
        run: |
          echo "environment=${{ inputs.environment_name }}"
          echo "remote_path=${{ inputs.remote_path }}"
          echo "compose_file=${{ inputs.compose_file }}"
          echo "deploy_sha=${{ steps.rev.outputs.sha }}"

      - name: Require test secrets (non-empty)
        if: inputs.deploy_kind == 'test'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD_TEST: ${{ secrets.POSTGRES_PASSWORD_TEST }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error title=Test secret missing::Секрет DATABASE_URL пуст или не задан (Repository secrets / Environment test)."
            exit 1
          fi
          if [ -z "${POSTGRES_PASSWORD_TEST}" ]; then
            echo "::error title=Test secret missing::Секрет POSTGRES_PASSWORD_TEST пуст или не задан — CI пишет им пароль в .env.test для сервиса db и синхронизирует DATABASE_URL (scripts/ci-normalize-database-url-test.py)."
            exit 1
          fi
          if [ -z "${VITE_API_BASE_URL}" ]; then
            echo "::error title=Test secret missing::Секрет VITE_API_BASE_URL пуст или не задан."
            exit 1
          fi
          if [ -z "${JWT_SECRET}" ] || [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "::error title=Test secret missing::Секрет JWT_SECRET пуст или короче 32 символов (backend/config.py). Задайте в Repository secrets или Environment test."
            exit 1
          fi
          echo "Test required secrets are set (values not logged)."

      # До rsync: иначе в логе appleboy видно printf с пустым первым аргументом.
      - name: Require prod secrets (non-empty)
        if: inputs.deploy_kind == 'prod'
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${POSTGRES_PASSWORD}" ]; then
            echo "::error title=Prod secret missing::Секрет POSTGRES_PASSWORD пуст или не задан (Settings → Secrets and variables → Actions → Repository secrets или Environment production)."
            exit 1
          fi
          if [ -z "${VITE_API_BASE_URL}" ]; then
            echo "::error title=Prod secret missing::В GitHub нет непустого секрета VITE_API_BASE_URL (Repository secrets или Environment production)."
            exit 1
          fi
          if [ -z "${JWT_SECRET}" ] || [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "::error title=Prod secret missing::Секрет JWT_SECRET пуст или короче 32 символов. Задайте в Repository secrets или Environment production."
            exit 1
          fi
          echo "Prod required secrets are set (values not logged)."

      - name: Rsync repository to server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # --delete: не трогать runtime-загрузки на VPS (часто root из Docker → Permission denied).
          # protect — не удалять на приёмнике; exclude — не слать из раннера (gitignore может быть пусто).
          switches: "-avzr --delete --filter='protect uploads/' --filter='protect backend/uploads/' --exclude=.git --exclude=node_modules --exclude=uploads/ --exclude=backend/uploads/"
          path: ./
          remote_path: ${{ inputs.remote_path }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Write env file and docker compose up (test)
        if: inputs.deploy_kind == 'test'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: APP_VERSION=${{ steps.rev.outputs.sha }}
          script: |
            set -euo pipefail
            cd "${{ inputs.remote_path }}"
            umask 077
            # Учётные данные Hub подставляются здесь (не через envs action): иначе значение с «=» в PAT
            # обрезается парсером envs и docker login не выполняется → 429 unauthenticated.
            if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              printf '%s' "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin docker.io
            else
              echo "WARN: задайте секреты DOCKERHUB_USERNAME и DOCKERHUB_TOKEN (оба непустые), иначе Docker Hub — анонимный лимит." >&2
            fi
            printf 'DATABASE_URL=%s\nPOSTGRES_PASSWORD=%s\nVITE_API_BASE_URL=%s\nJWT_SECRET=%s\n' \
              "${{ secrets.DATABASE_URL }}" \
              "${{ secrets.POSTGRES_PASSWORD_TEST }}" \
              "${{ secrets.VITE_API_BASE_URL }}" \
              "${{ secrets.JWT_SECRET }}" > "${{ inputs.env_file }}"
            sed -i 's/\r//g' "${{ inputs.env_file }}"
            python3 scripts/ci-normalize-database-url-test.py "${{ inputs.env_file }}"
            export APP_VERSION
            docker compose --env-file "${{ inputs.env_file }}" -f "${{ inputs.compose_file }}" up -d --build

      - name: Write env file and docker compose up (prod)
        if: inputs.deploy_kind == 'prod'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: APP_VERSION=${{ steps.rev.outputs.sha }}
          script: |
            set -euo pipefail
            cd "${{ inputs.remote_path }}"
            umask 077
            if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              printf '%s' "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin docker.io
            else
              echo "WARN: задайте секреты DOCKERHUB_USERNAME и DOCKERHUB_TOKEN (оба непустые), иначе Docker Hub — анонимный лимит." >&2
            fi
            printf 'POSTGRES_PASSWORD=%s\nVITE_API_BASE_URL=%s\nJWT_SECRET=%s\n' \
              "${{ secrets.POSTGRES_PASSWORD }}" \
              "${{ secrets.VITE_API_BASE_URL }}" \
              "${{ secrets.JWT_SECRET }}" > "${{ inputs.env_file }}"
            sed -i 's/\r//g' "${{ inputs.env_file }}"
            if ! grep -qE '^POSTGRES_PASSWORD=.+$' "${{ inputs.env_file }}"; then
              echo "ERROR: пароль БД пуст после подстановки. Задайте секрет POSTGRES_PASSWORD (Repository secrets / Environment production)." >&2
              exit 1
            fi
            if ! grep -qE '^VITE_API_BASE_URL=.+$' "${{ inputs.env_file }}"; then
              echo "ERROR: VITE_API_BASE_URL пустой или отсутствует. Добавьте репозиторный секрет **VITE_API_BASE_URL** (Actions → Repository secrets) или в Environment **production** (часто значение **/api**)." >&2
              exit 1
            fi
            if ! grep -qE '^JWT_SECRET=.{32,}$' "${{ inputs.env_file }}"; then
              echo "ERROR: JWT_SECRET пустой, короче 32 символов или отсутствует. Добавьте секрет JWT_SECRET (Environment production или Repository secrets)." >&2
              exit 1
            fi
            export APP_VERSION
            docker compose --env-file "${{ inputs.env_file }}" -f "${{ inputs.compose_file }}" up -d --build

      - name: Health gate (backend /health)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            port="${{ inputs.health_port }}"
            waited=0
            while [[ "${waited}" -lt 30 ]]; do
              if body=$(curl -fsS --max-time 2 "http://127.0.0.1:${port}/health" 2>/dev/null) && \
                 printf '%s' "${body}" | python3 -c 'import json,sys; json.loads(sys.stdin.read())' >/dev/null 2>&1; then
                echo "Health OK (${port})"
                exit 0
              fi
              sleep 1
              waited=$((waited + 1))
            done
            echo "Health check failed after 30s (127.0.0.1:${port}/health)" >&2
            cd "${{ inputs.remote_path }}"
            docker compose --env-file "${{ inputs.env_file }}" -f "${{ inputs.compose_file }}" ps >&2 || true
            docker compose --env-file "${{ inputs.env_file }}" -f "${{ inputs.compose_file }}" logs --tail=50 backend >&2 || true
            if [ "${{ inputs.deploy_kind }}" = "prod" ]; then
              echo "Подсказка (prod): password authentication failed часто значит: пароль в секрете POSTGRES_PASSWORD не совпадает с паролем пользователя postgres В УЖЕ СУЩЕСТВУЮЩЕМ томе. POSTGRES_PASSWORD в compose меняет пароль только при ПЕРВОМ init тома; смена секрета в GitHub сама по себе пароль в БД не обновляет. См. README «Prod: password authentication failed»." >&2
            fi
            exit 1
