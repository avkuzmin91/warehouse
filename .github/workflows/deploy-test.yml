name: Deploy TEST

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to TEST server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            cd /var/www/app-test

            # ===== ENV FILE =====
            cat > .env.test << EOF
POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_TEST }}
DATABASE_URL=postgresql://postgres:${{ secrets.POSTGRES_PASSWORD_TEST }}@db:5432/app_test
VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL_TEST }}
APP_VERSION=${{ github.sha }}
EOF

            # ===== DEPLOY =====
            docker compose -f docker-compose.test.yml down --remove-orphans
            docker compose -f docker-compose.test.yml up -d --build --force-recreate

            # ===== HEALTH CHECK =====
            sleep 10
            docker ps