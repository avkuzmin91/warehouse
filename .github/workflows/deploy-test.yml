name: Deploy TEST

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to TEST server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            cd /var/www/app-test

            # ===== ENV FILE =====
            printf "POSTGRES_PASSWORD=%s\nDATABASE_URL=postgresql://postgres:%s@db:5432/app_test\nVITE_API_BASE_URL=%s\nAPP_VERSION=%s\n" \
              "${{ secrets.POSTGRES_PASSWORD_TEST }}" \
              "${{ secrets.POSTGRES_PASSWORD_TEST }}" \
              "${{ secrets.VITE_API_BASE_URL_TEST }}" \
              "${{ github.sha }}" > .env.test

            # ===== DEPLOY =====
            docker compose -f docker-compose.test.yml down --remove-orphans
            docker compose -f docker-compose.test.yml up -d --build --force-recreate

            # ===== HEALTH CHECK =====
            sleep 10
            docker ps