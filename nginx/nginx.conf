            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://127.0.0.1:11000/health;
        }

        location = /api {
            return 301 https://$host/api/;
        }

        location /api/ {
            proxy_http_version 1.1;
            proxy_connect_timeout 15s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://127.0.0.1:11000/;
            add_header Cache-Control "private, no-store" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        location ^~ /assets/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://127.0.0.1:11080;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://127.0.0.1:11080;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        }
    }

    # --- HTTPS DEV (Vite 5173 + backend 8000; см. README §3) ---
    # Без отдельного server_name dev.pack-men.ru запросы могли попадать в prod/test и давать 502 на /api.
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name dev.pack-men.ru;

        ssl_certificate     /etc/ssl/cloudflare/origin.pem;
        ssl_certificate_key /etc/ssl/cloudflare/origin.key;

        location = /health {
            access_log off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://127.0.0.1:8000/health;
        }

        location = /api {
            return 301 https://$host/api/;
        }

        location /api/ {
            proxy_http_version 1.1;
            proxy_connect_timeout 15s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://127.0.0.1:8000/;
            add_header Cache-Control "private, no-store" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ^~ /assets/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://127.0.0.1:5173;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Без CSP: Vite dev-сервер использует inline-скрипты (HMR / react-refresh preamble).
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://127.0.0.1:5173;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
