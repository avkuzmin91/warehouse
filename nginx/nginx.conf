# Host nginx: /etc/nginx/nginx.conf → symlink на этот файл.
# / → статический frontend (serve); /api/ → FastAPI (strip /api); /health → backend.
# TLS: сертификаты Cloudflare Origin (или замените пути на Let's Encrypt).
#
# Кэш: /assets/* (хэш в имени) — immutable; HTML/SPA и API — no-store / no-cache + CDN-Cache-Control,
# чтобы Cloudflare/браузер не отдавали старую оболочку при уже совпадающих Docker-образах prod и test.
#
# Security-заголовки добавляются в каждой location с add_header: в nginx add_header
# НЕ наследуется в location, где есть свои add_header (иначе пропали бы при Cache-Control).
# CSP — только на SPA-локациях prod/test: dev проксирует Vite, которому нужны inline-скрипты HMR.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;

    # Скрытие метаданных nginx: без номера версии в Server и на страницах ошибок.
    server_tokens off;
    # Убрать заголовок Server от upstream (FastAPI, проксируемый фронт).
    proxy_hide_header Server;
    # Полностью убрать «Server: nginx» (в т.ч. без версии) можно только через HeadersMoreModule:
    # в этом же блоке http { } или в server { } — строка: more_clear_headers Server;
    # Раскомментировать только если nginx собран/подключён с ngx_http_headers_more_filter_module.

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- HTTP: редирект на HTTPS (кроме localhost — для curl без TLS) ---
    server {
        listen 80;
        listen [::]:80;
        server_name pack-men.ru www.pack-men.ru test.pack-men.ru dev.pack-men.ru;
        return 301 https://$host$request_uri;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        location = /health {
            access_log off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://127.0.0.1:10000/health;
        }

        location /api/ {
            proxy_http_version 1.1;
            proxy_connect_timeout 15s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://127.0.0.1:10000/;
            add_header Cache-Control "private, no-store" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ^~ /assets/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://127.0.0.1:10080;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://127.0.0.1:10080;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        }
    }

    # --- HTTPS PRODUCTION (10080 frontend / 10000 API) ---
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name pack-men.ru www.pack-men.ru;

        ssl_certificate     /etc/ssl/cloudflare/origin.pem;
        ssl_certificate_key /etc/ssl/cloudflare/origin.key;

        location = /health {
            access_log off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://127.0.0.1:10000/health;
        }

        location = /api {
            return 301 https://$host/api/;
        }

        location /api/ {
            proxy_http_version 1.1;
            proxy_connect_timeout 15s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://127.0.0.1:10000/;
            add_header Cache-Control "private, no-store" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        location ^~ /assets/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://127.0.0.1:10080;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://127.0.0.1:10080;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        }
    }

    # --- HTTPS TEST (11080 / 11000) ---
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name test.pack-men.ru;

        ssl_certificate     /etc/ssl/cloudflare/origin.pem;
        ssl_certificate_key /etc/ssl/cloudflare/origin.key;

        location = /health {
            access_log off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
