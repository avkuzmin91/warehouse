# Staging = test: та же схема, что prod, другие порты / env / том БД.
name: wms-test

services:
  db:
    image: postgres:16
    container_name: wms_test_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: app_test
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_test"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 90s

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-}
    container_name: wms_test_backend
    restart: always
    environment:
      APP_ENV: test
      APP_VERSION: ${APP_VERSION:-}
    env_file:
      - .env.test
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:11000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_TITLE: "pack-men - test"
    container_name: wms_test_frontend
    restart: always
    env_file:
      - .env.test
    depends_on:
      - backend
    ports:
      - "127.0.0.1:11080:80"

volumes:
  db_test_data:
