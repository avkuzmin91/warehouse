# Staging = test: та же схема, что prod, другие порты / env / том БД.
name: wms-test

services:
  db:
    image: postgres:16
    container_name: wms_test_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_test
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db_test_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: wms_test_backend
    restart: always
    env_file:
      - .env.test
    depends_on:
      - db
    ports:
      - "127.0.0.1:11000:8000"

  frontend:
    build: ./frontend
    container_name: wms_test_frontend
    restart: always
    env_file:
      - .env.test
    depends_on:
      - backend
    ports:
      - "127.0.0.1:11080:80"

volumes:
  db_test_data:
