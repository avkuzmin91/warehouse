# Тестовое окружение: изолированные контейнеры и том (не production).
name: wms-test

services:
  db:
    image: postgres:16
    container_name: wms_test_db
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_test
    volumes:
      - db_data_test:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: wms_test_backend
    restart: "no"
    env_file:
      - .env.test
    depends_on:
      - db
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: wms_test_frontend
    restart: "no"
    env_file:
      - .env.test
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: wms_test_nginx
    restart: "no"
    ports:
      - "9080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  db_data_test:
